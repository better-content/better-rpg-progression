plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0.7-dev-SNAPSHOT'
    id 'org.jetbrains.kotlin.jvm' version '2.0.0'
    id 'org.spongepowered.mixin' version '0.7.38'
}

mixin {
    add sourceSets.main, 'better_rpg_progression.refmap.json'
    config 'better_rpg_progression.mixins.json'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'better-rpg-progression'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    visualHarness {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    visualHarnessImplementation.extendsFrom implementation
    visualHarnessRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: 'parchment', version: parchment_mappings

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        visualHarness {
            parent minecraft.runs.client
            client true
            workingDirectory project.file('run-visual-harness')
            property 'forge.logging.console.level', 'info'
            property 'better_rpg_progression.visualHarness', 'true'
            args '--width', '1280', '--height', '720'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.visualHarness
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    maven { url = 'https://maven.latvian.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
}

def visualHarnessNotices = tasks.register('stageVisualHarnessNotices', Jar) {
    archiveFileName = 'better-gameplay-notices-dev.jar'
    destinationDirectory = layout.buildDirectory.dir('visual-harness')
    from '../better-gameplay-notices/build/classes/java/main'
    from '../better-gameplay-notices/build/resources/main'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files(System.getenv('BC_CUSTOM_MOD_JAR_DIR')
        ? "${System.getenv('BC_CUSTOM_MOD_JAR_DIR')}/better-gameplay-notices-1.0.0.jar"
        : '../better-gameplay-notices/build/libs/better-gameplay-notices-1.0.0.jar')
    // The isolated client uses named development classes; the deployable JAR is reobfuscated.
    visualHarnessRuntimeOnly files(visualHarnessNotices.flatMap { it.archiveFile })
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    implementation fg.deobf("thedarkcolour:kotlinforforge:${kff_version}")
    // The language provider is nested into KotlinForForge at runtime; expose its
    // typed loading-context API to compilation instead of discovering it reflectively.
    compileOnly "thedarkcolour:kfflang:${kff_version}"
    compileOnly fg.deobf('curse.maven:blood-magic-224791:7956981')
    runtimeOnly fg.deobf('curse.maven:blood-magic-224791:7956981')
    runtimeOnly fg.deobf('curse.maven:patchouli-306770:7731017')
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5:2.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(ProcessResources).configureEach {
    def replaceProps = [
            minecraft_version: minecraft_version,
            forge_version: forge_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProps

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProps
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

test {
    useJUnitPlatform()
}

tasks.named('compileJava', JavaCompile).configure {
    // MixinGradle writes these beside javac's normal outputs. Declaring them prevents
    // an incremental/cache restore from considering compilation complete while the
    // release-critical production refmap is absent.
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json'))
    outputs.file(layout.buildDirectory.file('tmp/compileJava/better_rpg_progression.refmap.json'))
    // The Mixin annotation processor does not recreate refmaps reliably from javac's
    // incremental state when these sidecars are deleted independently of class files.
    options.incremental = false
}

tasks.register('verifyMixinRefmap') {
    group = 'verification'
    description = 'Requires the production JAR to contain the generated Mixin refmap.'
    dependsOn tasks.named('jar')
    doLast {
        def archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def entry = zip.getEntry('better_rpg_progression.refmap.json')
            if (entry == null || entry.size <= 2) {
                throw new GradleException("${archive.name} is missing better_rpg_progression.refmap.json")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifyFast') {
    group = 'verification'
    description = 'Runs the fast deterministic verification lane.'
    dependsOn tasks.named('check'), tasks.named('verifyMixinRefmap')
}

tasks.register('verifyFull') {
    group = 'verification'
    description = 'Runs JVM verification and transformed production GameTests.'
    dependsOn tasks.named('verifyFast'), tasks.named('runGameTestServer')
}

tasks.register('syncGameTestStructures', Copy) {
    from 'src/main/resources/gameteststructures'
    into 'run-gametest/gameteststructures'
}

tasks.matching { it.name == 'prepareRunGameTestServer' }.configureEach {
    dependsOn tasks.named('syncGameTestStructures')
}

tasks.register('prepareVisualHarnessOptions', Copy) {
    group = 'verification'
    description = 'Installs deterministic GUI settings for the isolated visual harness.'
    from 'src/visualHarness/options.txt'
    into 'run-visual-harness'
}

tasks.configureEach {
    if (name == 'runVisualHarness') {
        dependsOn tasks.named('prepareVisualHarnessOptions')
        dependsOn visualHarnessNotices
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

tasks.register('stageRuntimeJar', Copy) {
    group = 'build'
    description = 'Stages the reobfuscated runtime jar into build/libs using the canonical release filename.'
    dependsOn tasks.named('reobfJar')
    from layout.buildDirectory.file('reobfJar/output.jar')
    into layout.buildDirectory.dir('libs')
    rename { "${project.base.archivesName.get()}-${project.version}.jar" }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('stageRuntimeJar')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}
